# Local development stack. Credentials here are for a laptop-only database and are not used in any deployed environment.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: detection
      POSTGRES_PASSWORD: detection
      POSTGRES_DB: detection
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detection -d detection"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
