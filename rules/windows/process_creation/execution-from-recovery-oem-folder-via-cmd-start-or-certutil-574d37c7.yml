title: Execution from Recovery\OEM Folder via cmd start or certutil URLCache Download (UAT-12643)
id: 574d37c7-8311-4c81-8cf4-c4a03f2cb459
status: experimental
description: Detects UAT-12643 tradecraft. One branch catches cmd.exe launching a stub from the Windows Recovery\OEM folder
  with 'cmd.exe /c start'. The other catches certutil used as a one-liner downloader with '-urlcache -f', including the en-dash
  variant of the switch.
references:
- https://blog.talosintelligence.com/uat-12643-suspected-north-korea-aligned-actor-blends-blockchain-resilience-with-targeted-infostealing/
date: '2026-11-21'
logsource:
  category: process_creation
  product: windows
detection:
  selection_recovery_img:
  - Image|endswith: \cmd.exe
  - OriginalFileName: Cmd.Exe
  selection_recovery_cli:
    CommandLine|contains|all:
    - /c
    - start
    - \Recovery\OEM\
  selection_certutil_img:
  - Image|endswith: \certutil.exe
  - OriginalFileName: CertUtil.exe
  selection_certutil_urlcache:
    CommandLine|contains: urlcache
  selection_certutil_force:
    CommandLine|contains:
    - ' -f'
    - ' –f'
  condition: (selection_recovery_img and selection_recovery_cli) or (selection_certutil_img and selection_certutil_urlcache
    and selection_certutil_force)
falsepositives:
- OEM recovery or imaging tooling that runs vendor scripts from the Recovery\OEM folder (e.g. during push-button reset).
- Administrators or legacy scripts using certutil -urlcache -f to fetch files or certificates.
level: high
